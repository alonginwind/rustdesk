[package]
name = "web_bridge"
version = "0.1.0"
edition = "2021"
description = "Protocol codec, NaCl crypto and zstd decompression for the Flutter web client, compiled to WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to the wasm-bindgen-cli version installed for wasm-pack; a mismatch makes wasm-pack
# download a second CLI. js-sys resolves against that pin on its own.
wasm-bindgen = "=0.2.127"
js-sys = "0.3"
ruzstd = "0.7.3"
crypto_box = "0.9.1"
crypto_secretbox = "0.1.1"
ed25519-dalek = "2.2.0"
# Only OsRng is needed, so depend on rand_core directly instead of all of rand.
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
# The "js" feature is what makes OsRng work on wasm32-unknown-unknown at all.
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
